name: Problema / Bug report
description: Algo não funcionou como deveria. / Something didn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu? / What happened?
      description: Conte o que você fez e o que apareceu. Se tiver mensagem de erro no painel, copie aqui. / What you did and what showed up, including any panel error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que você esperava? / What did you expect?
  - type: input
    id: plugin
    attributes:
      label: Versão do plugin / Plugin version
      description: A que aparece em Configurações → Plugins → QuestGrinder. É a versão que está rodando no Discord. / The one shown in Settings → Plugins → QuestGrinder. It's the version Discord is actually running.
      placeholder: "1.0.4"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit baixado / Downloaded commit
      description: Opcional. Rode `git log -1 --oneline` dentro da pasta do plugin. O atualizador baixa antes de aplicar, então isso pode ser mais novo que a versão acima até você recompilar ou clicar na notificação de atualização. / Optional. Run `git log -1 --oneline` in the plugin folder. The updater downloads before applying, so this can be newer than the version above until you rebuild or click the update notification.
  - type: dropdown
    id: rebuilt
    attributes:
      label: Depois da última atualização, você aplicou ela? / Did you apply the last update?
      description: Aplicar = clicar na notificação "QuestGrinder atualizado", rodar `pnpm build` ou o Equicord ter atualizado. / Applying = clicking the "QuestGrinder updated" notification, running `pnpm build`, or an Equicord update.
      options:
        - Sim / Yes
        - Não / No
        - Não sei / Not sure
  - type: input
    id: equicord
    attributes:
      label: Versão do Equicord / Equicord version
      description: Rode `git log -1 --oneline` dentro da pasta do Equicord. / Run `git log -1 --oneline` in the Equicord folder.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: App / Client
      options:
        - Discord Stable
        - Discord PTB
        - Discord Canary
        - Vesktop
        - Equibop
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema / OS
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true
  - type: dropdown
    id: quest
    attributes:
      label: Tipo de missão / Quest type
      options:
        - Vídeo / Video
        - Jogo / Game
        - Atividade / Activity
        - Não é sobre uma missão / Not quest related
  - type: textarea
    id: logs
    attributes:
      label: Console
      description: Opcional. Abra o console (Ctrl+Shift+I), procure linhas com "QuestGrinder" e cole aqui. / Optional. Open the console (Ctrl+Shift+I) and paste lines mentioning "QuestGrinder".
      render: text
